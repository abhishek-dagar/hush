[workspace]
resolver = "3"
members = [
    "apps/browser",
    "apps/shell",
    "crates/base",
    "crates/css",
    "crates/display-list",
    "crates/dom",
    "crates/embed",
    "crates/html",
    "crates/image",
    "crates/ipc",
    "crates/layout",
    "crates/navigation",
    "crates/net",
    "crates/page",
    "crates/paint",
    "crates/render",
    "crates/script",
    "crates/script-quickjs",
    "crates/text",
    "crates/ui",
    "tools/conformance",
    "tools/perf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
base = { path = "crates/base" }
css = { path = "crates/css" }
display-list = { path = "crates/display-list" }
dom = { path = "crates/dom" }
embed = { path = "crates/embed" }
html = { path = "crates/html" }
image = { path = "crates/image" }
ipc = { path = "crates/ipc" }
layout = { path = "crates/layout" }
navigation = { path = "crates/navigation" }
net = { path = "crates/net" }
page = { path = "crates/page" }
paint = { path = "crates/paint" }
render = { path = "crates/render" }
script = { path = "crates/script" }
script-quickjs = { path = "crates/script-quickjs" }
text = { path = "crates/text" }
ui = { path = "crates/ui" }

# External crates (spec 0001, "Proposed stack")
anyhow = "1.0.104"
# Browser chrome (spec 0003). Linux OS settings through the XDG Settings
# portal; only the `settings` portal, on the portal listener's tokio runtime.
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "settings"] }
# macOS appearance notifications take a block.
block2 = "0.6.2"
# Response bodies on the network thread (spec 0004, child 0001): the
# chunk type hyper hands out.
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
# Profile test only (spec 0003, Enforcement), until the engine adds it.
cssparser = "0.38.0"
# Document decoding (spec 0004, child 0002). No `serde` or `simd` features.
encoding_rs = "0.8.42"
# System font lookup and loading (spec 0004, child 0004). `system` finds the
# OS fonts; the default `std` is kept, nothing else.
fontique = { version = "0.12.0", default-features = false, features = ["std", "system"] }
# Per label scripts for the address's IDN rule (spec 0008, AC-4). Already
# in the binary through `url`'s `idna`, with the same baked data.
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Grapheme boundaries for caret moves and deletes in text inputs (spec
# 0008, AC-13). Grapheme rules only: no `auto`/`lstm` (line and word
# dictionaries). Held at 2.3 with icu_properties so the icu crates ship once.
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Unicode hosts for the address (spec 0008, AC-4); already in the binary
# through `url`.
idna = "1.1.0"
# Text shaping (spec 0004, child 0004). Only `std`. Held at 0.12, with
# skrifa at 0.44, so all three font crates share one `read-fonts` (0.41,
# fontique's) instead of shipping two. Move them together.
harfrust = { version = "0.12.0", default-features = false, features = ["std"] }
# Brotli bodies (spec 0004, child 0001, Compression). Decoding only; the
# default `std` gives the streaming writer.
brotli-decompressor = "6.1.0"
# gzip and deflate bodies (spec 0004, child 0001). The default pure Rust
# `miniz_oxide` backend, so no C build.
flate2 = "1.1.10"
# GIF decoding, first frame only (spec 0004, child 0005). No default
# features: `color_quant` is for encoding and `raii_no_panic` is not needed.
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# WebP decoding, lossy and lossless (spec 0004, child 0005). No features.
image-webp = "0.2.4"
# The HTTP client (spec 0004, child 0001): HTTP/1.1, and HTTP/2 when the
# server offers `h2` by ALPN.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "http2"] }
# TLS for the client (spec 0004, child 0001). No default features: they pull
# in `aws-lc-rs` (cmake, NASM, a bigger binary) and the native root store,
# which the platform verifier replaces.
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "ring"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
# QuickJS-ng for page scripts (spec 0004, child 0006); only
# `script-quickjs` names it (spec 0001, script boundary). `classes` for the
# DOM wrappers and their finalizers, `properties` for accessors; no
# `futures`, `loader` or macros.
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "classes", "properties"] }
# Settings file location (spec 0003, Persistence).
dirs = "7.0.0"
# The portal's change stream on Linux; already in the tree through zbus.
futures-util = { version = "0.3.31", default-features = false }
# Snapshot tests for the engine's text dumps (spec 0002, AC-17). Dev only,
# never shipped; `colors` (console output) is not needed.
insta = { version = "1.49.0", default-features = false }
ipc-channel = "0.23.0"
# The conformance harness's command line (spec 0005); no dependencies of
# its own. Used by `tools/conformance` only, never shipped.
lexopt = "0.3.2"
libc = "0.2.191"
# Read only system font files mapped once per file, so the content and
# browser processes share the pages and no copy is made (spec 0032, AC-1).
# Already in the tree through `fontique`.
memmap2 = "0.9.11"
# Native menus on macOS and Windows (spec 0003, Menus). The default GTK
# backend is off: Linux menus are drawn in the window.
muda = { version = "0.21.2", default-features = false }
# macOS appearance readers, the versions muda and wgpu already pull in.
objc2 = "0.6.5"
# NSWindow, NSView and NSButton place the traffic lights on the sidebar's
# top row (spec 0003 frame, as in Zen).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSWorkspace", "NSAccessibility", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSString", "NSOperation", "block2"] }
pollster = "1.0.1"
# PNG decoding (spec 0004, child 0005); already in the binary through muda.
png = "0.18.1"
# Display list wire format (spec 0002, Transport). `use-std` only; the default
# `heapless` support is for embedded targets.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
# Atoms for tag, attribute and namespace names (spec 0002, base). Serde support is
# not needed: atoms never cross the process boundary.
string_cache = { version = "0.11.0", default-features = false }
string_cache_codegen = "0.11.2"
thiserror = "2.0.21"
# The portal listener's runtime on Linux; the network thread will reuse it.
tokio = { version = "1.54.0", default-features = false, features = ["rt"] }
# TLS (spec 0004, AC-3): the `ring` provider, TLS 1.2 and 1.3. No
# `aws-lc-rs`, no logging bridge.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
# Certificates checked against the OS trust store (spec 0004, AC-3).
rustls-platform-verifier = "0.7.1"
# The connector trait, to give the TLS connector its 15 s limit
# (spec 0004, AC-4); already in the tree through hyper-util.
tower-service = "0.3.3"
# Property tests: arbitrary bytes in arbitrary chunks never break the
# parser (spec 0004, AC-17). Dev only, never shipped; `std` is all it needs
# (no fork or timeout support).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Reading the html5lib-tests JSON files (spec 0004, child 0002, Testing).
# Dev only, never shipped.
serde_json = "1.0.154"
# The OS clipboard (spec 0008, AC-15): text only, so the image features
# (and the `image` crate) stay out. Linux adds the Wayland data control
# protocol in `embed`; X11 goes through `x11rb`, which winit already links.
arboard = { version = "3.7.0", default-features = false }
# Native file dialogs (spec 0003, AC-10). Since 0.17 rfd talks to the XDG
# portal itself, without ashpd or tokio. `wayland` parents the Linux dialog
# to the window; the Wayland client crates already come with winit.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
# Font tables, metrics and glyph outlines (spec 0004, children 0004 and
# 0005). `std` only; `autohint` and `traversal` are not needed.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# `settings.toml`: read into a table and written back. `serde` is what
# exposes `Table`; serde is already in the tree.
toml = { version = "1.1.4", default-features = false, features = ["std", "parse", "display", "serde"] }
# URLs for navigation and the CLI input (spec 0004, child 0001).
url = "2.5.8"
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# GL backend compiled out on purpose (spec 0001): Metal, DX12 and Vulkan only.
# `wgsl` is the one shader language front end, needed to draw display lists.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "wgsl"] }
# Windows window procedure subclass, registry and system parameters, the
# version already in the tree.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse"] }
winit = "0.30.13"
# JPEG decoding (spec 0004, child 0005). The default SIMD paths (`x86`,
# `neon`) are kept: decoding runs on the page thread.
zune-jpeg = "0.5.15"
# Glyph rasterizing on the render side (spec 0004, child 0005). `eval`
# (path evaluation) is what the mask renderer needs; `std` for floats.
zeno = { version = "0.3.3", default-features = false, features = ["eval", "std"] }

# Lints that turn the AGENTS.md rules into checks. Every crate opts in with
# `[lints] workspace = true`; `cargo clippy -- -D warnings` makes them errors.
[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# An `#[allow]` must say why, e.g. the proven invariant behind an `expect`.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
# Every `unsafe` block carries a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# Dependencies (wgpu, the text stack, QuickJS) build optimized in dev too, so
# `cargo run` scrolls and lays out at a usable speed. Workspace crates stay at
# opt-level 0 and rebuild fast.
[profile.dev.package."*"]
opt-level = 2

# The render thread redraws the whole frame on every scroll step. Built at
# opt-level 0 that took 12 ms a frame on a long page, over the 8.3 ms a
# 120 Hz display allows, so scrolling stuttered; at opt-level 2 it fits.
[profile.dev.package.render]
opt-level = 2

[profile.dev.package.display-list]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# The conformance harness (spec 0005): release speed for the 5 minute
# budget, quick to build, and debug assertions on so silent engine bugs
# become CRASH results. A panic ends the worker; the parent records CRASH.
[profile.conformance]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug-assertions = true
overflow-checks = true
panic = "unwind"
