<!DOCTYPE html>
<html>
<head>
<title>{{title}}</title>
<style>
body { margin: 0; font-family: sans-serif; background-color: #ffffff; color: #1f1f1f; }
main { max-width: 560px; margin: 0 auto; padding: 96px 16px 0; }
h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; overflow-wrap: break-word; }
p { margin: 0; font-size: 14px; color: #474747; }
p.note { margin-top: 16px; }
@media (prefers-color-scheme: dark) {
  body { background-color: #1f1f1f; color: #e3e3e3; }
  p { color: #c4c4c4; }
}
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p>{{details}}</p>
<p class="note">This browser can't show this file. Saving files arrives with Downloads.</p>
</main>
</body>
</html>
