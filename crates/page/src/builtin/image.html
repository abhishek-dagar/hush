<!DOCTYPE html>
<html>
<head>
<title>{{title}}</title>
<style>
html, body { margin: 0; }
body { display: flex; min-height: 100vh; background-color: #0e0e0e; }
img { display: block; margin: auto; max-width: 100vw; max-height: 100vh; user-select: none; }
img.zoomable { cursor: zoom-in; }
img.actual { max-width: none; max-height: none; cursor: zoom-out; }
</style>
</head>
<body><img src="{{src}}" alt="{{title}}"></body>
</html>
