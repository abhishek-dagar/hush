<!doctype html>
<title>Custom properties</title>
<style>
  :root { --accent: #c33; --gap: 8px; --pad: calc(var(--gap) * 2) }
  body { margin: var(--gap) }
  .card { --accent: #36c; border: 2px solid var(--accent); padding: var(--gap) }
  .title { color: var(--accent) }
  .fallback { color: var(--missing, #393) }
  .cycle { --a: var(--b); --b: var(--a); color: var(--a, red) }
  .invalid { --size: nope; margin-left: var(--size) }
  .inherited { color: var(--accent) }
</style>
<p class=title>root accent</p>
<div class=card><p class=title>card accent overrides</p><p class=inherited>inherits the card's value</p></div>
<p class=fallback>fallback used</p>
<p class=cycle>a cycle is invalid at computed value time</p>
<p class=invalid>an invalid value falls back to the initial margin</p>
