[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The browser's own chrome: settings, OS appearance, frameless windows,
# native menus, file dialogs and the chrome document (spec 0003). Only
# `apps/browser` enables it; the app shell stays chrome free.
chrome = [
    "dep:ui",
    "dep:dirs",
    "dep:muda",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:block2",
    "dep:windows-sys",
    "dep:ashpd",
    "dep:tokio",
    "dep:futures-util",
    "dep:pollster",
    "dep:rfd",
]

[dependencies]
display-list.workspace = true
ipc.workspace = true
navigation.workspace = true
net.workspace = true
page.workspace = true
postcard.workspace = true
render.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
winit.workspace = true

ui = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
muda = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
