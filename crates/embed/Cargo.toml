[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The browser's own chrome: settings, OS appearance, frameless windows,
# native menus, file dialogs and the chrome document (spec 0003). Only
# `apps/browser` enables it; the app shell stays chrome free.
chrome = [
    "dep:ui",
    "dep:dirs",
    "dep:muda",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:block2",
    "dep:windows-sys",
    "dep:ashpd",
    "dep:tokio",
    "dep:futures-util",
    "dep:pollster",
    "dep:rfd",
    "dep:arboard",
]

[dependencies]
display-list.workspace = true
ipc.workspace = true
memmap2.workspace = true
navigation.workspace = true
net.workspace = true
page.workspace = true
postcard.workspace = true
render.workspace = true
skrifa.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
winit.workspace = true

ui = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
libc.workspace = true
muda = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
muda = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { workspace = true, optional = true, features = ["wayland-data-control"] }
ashpd = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The keyboard only walk (spec 0008, AC-36): the real network against the
# `net` crate's local TLS test server, a real page and the chrome's address
# palette. Test only, never shipped; all already in the lockfile.
bytes.workspace = true
dom.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "server-auto"] }
paint.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
ui.workspace = true

[lints]
workspace = true
