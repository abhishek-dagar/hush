<!doctype html>
<!--
  The browser window's chrome document (spec 0003, frame anatomy). The
  browser process renders it with the engine, scripts off, from assets
  embedded in the binary. Rust writes the root attributes and font size,
  and changes state through ARIA attributes and text on elements found by
  id; it never injects markup. The Linux app menu is built into #app-menu
  from the menu model when it opens.
-->
<html lang="en" data-tabs="vertical">
  <head>
    <meta charset="utf-8" />
    <title>Browser</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="frame.css" />
  </head>
  <body>
    <div class="frame" id="frame" data-side="right" data-drag-region>
      <div class="caption" data-drag-region>
        <button
          class="icon-button caption-menu"
          id="app-menu-button"
          aria-label="Menu"
          aria-haspopup="menu"
          aria-expanded="false"
          data-command="menu.app"
        >
          <span class="icon" aria-hidden="true">&#xE00B;</span>
        </button>
        <div class="caption-buttons" id="caption-buttons">
          <button
            class="caption-button"
            id="caption-minimize"
            tabindex="-1"
            aria-label="Minimize"
            data-command="window.minimize"
          >
            <span class="caption-glyph" aria-hidden="true">&#xE921;</span
            ><span class="icon" aria-hidden="true">&#xE010;</span>
          </button>
          <button
            class="caption-button"
            id="caption-maximize"
            tabindex="-1"
            aria-label="Maximize"
            data-command="window.maximize"
          >
            <span
              class="caption-glyph"
              id="caption-maximize-glyph"
              aria-hidden="true"
              >&#xE922;</span
            ><span class="icon" aria-hidden="true">&#xE011;</span>
          </button>
          <button
            class="caption-button"
            id="caption-close"
            tabindex="-1"
            aria-label="Close"
            data-command="window.close"
          >
            <span class="caption-glyph" aria-hidden="true">&#xE8BB;</span
            ><span class="icon" aria-hidden="true">&#xE004;</span>
          </button>
        </div>
      </div>
      <div class="frame-body">
        <nav class="frame-sidebar" aria-label="Sidebar" data-drag-region>
          <!--
            Navigation (spec 0008, AC-1): back, forward and reload, then the
            address. Rust sets aria-disabled on back and forward, and turns
            reload into stop while a load runs (AC-25).
          -->
          <div class="nav-row" id="nav-row" data-drag-region>
            <button
              class="icon-button"
              id="nav-back"
              aria-label="Back"
              aria-disabled="true"
              data-command="nav.back"
            >
              <span class="icon" aria-hidden="true">&#xE000;</span>
            </button>
            <button
              class="icon-button"
              id="nav-forward"
              aria-label="Forward"
              aria-disabled="true"
              data-command="nav.forward"
            >
              <span class="icon" aria-hidden="true">&#xE001;</span>
            </button>
            <button
              class="icon-button"
              id="nav-reload"
              aria-label="Reload"
              data-command="nav.reload"
            >
              <span class="icon" id="nav-reload-icon" aria-hidden="true">&#xE002;</span>
            </button>
          </div>
          <!--
            The address (AC-2): a pill that opens the palette (palette
            style, the default) or a field (inline style). Rust shows one,
            writes the icon, the host and the field's value, and shows the
            intent row under the field while it holds text (AC-7).
          -->
          <button
            class="address"
            id="address-pill"
            aria-label="Search or enter address"
            data-command="address.open"
          >
            <span class="icon" id="address-icon" aria-hidden="true">&#xE017;</span>
            <span class="label" id="address-host" hidden></span>
            <span class="label address-placeholder" id="address-placeholder"
              >Search or enter address</span
            >
          </button>
          <div class="address address-inline" id="address-inline" hidden>
            <span class="icon" id="address-field-icon" aria-hidden="true">&#xE017;</span>
            <input
              class="address-input"
              id="address-field"
              aria-label="Address"
              placeholder="Search or enter address"
              spellcheck="false"
            />
          </div>
          <div class="intent" id="address-intent" data-command="address.go" hidden>
            <span class="icon" id="address-intent-icon" aria-hidden="true">&#xE006;</span>
            <span class="label" id="address-intent-text"></span>
          </div>
        </nav>
        <main class="page-slot" id="page-slot"></main>
      </div>
      <!--
        The overlay layer (spec 0008, Decision): drawn after the page and hit
        tested before it. Rust places each piece over the page card with a
        style attribute, from the card's box.
      -->
      <div class="loading-bar" id="loading-bar" data-layer="overlay" hidden>
        <div class="loading-shimmer" id="loading-shimmer"></div>
      </div>
      <div class="status-bubble" id="status-bubble" data-layer="overlay" hidden>
        <span class="status-text" id="status-text"></span>
      </div>
      <div class="palette-scrim" id="palette-scrim" data-layer="overlay" hidden></div>
      <div
        class="palette"
        id="palette"
        role="dialog"
        aria-label="Search or enter address"
        data-layer="overlay"
        hidden
      >
        <div class="palette-field">
          <span class="icon" id="palette-icon" aria-hidden="true">&#xE017;</span>
          <input
            class="address-input"
            id="palette-field"
            aria-label="Address"
            placeholder="Search or enter address"
            spellcheck="false"
          />
        </div>
        <div class="intent" id="palette-intent" data-command="address.go" hidden>
          <span class="icon" id="palette-intent-icon" aria-hidden="true">&#xE006;</span>
          <span class="label" id="palette-intent-text"></span>
        </div>
      </div>
      <div
        class="menu app-menu"
        id="app-menu"
        role="menu"
        aria-label="Menu"
        hidden
      ></div>
    </div>
  </body>
</html>
