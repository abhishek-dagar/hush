<body>
<h1>A very light browser</h1>
<p>This browser shows web pages and nothing else: no accounts, no sync, no tracking.</p>
<p>Open a page by passing its address when you start the browser:</p>
<pre>browser http://example.com/</pre>
<p>A file on your computer works too:</p>
<pre>browser page.html</pre>
</body>
</html>
